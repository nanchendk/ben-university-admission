name: Build private university data
on:
  push:
    branches: [main]
    paths:
      - 'build_private.py'
      - 'prepare.py'
      - 'source.xlsx'
      - '.github/workflows/build-private.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: python build_private.py
      - name: Commit generated private university data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-private.json
          if ! git diff --cached --quiet; then
            git commit -m "data: generate 115 private university admissions"
            git push
          fi
